# Presentation only. This is the theme Streamlit paints before app.py runs;
# the palettes in app.py then take over. Keeping it dark avoids a white flash
# on load.

[theme]
base = "dark"
primaryColor = "#cfd8d5"
backgroundColor = "#14181a"
secondaryBackgroundColor = "#1b2023"
textColor = "#e8e6e1"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
